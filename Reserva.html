<html>
<head>
    <title>Reserva</title>
    <style>
        body {
            background-color: bisque;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        h1 {
            color: crimson;
            text-align: center;
        }
        
        h2 {
            color: darkred;
        }
        
        form {
            max-width: 500px;
            margin: 0 auto;
            background-color: #f7e1c6;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid black;
        }

        fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }

        .guti {
            border: 4px solid black;
            border-radius: 5px;
            background-color: darkred;
            color: white;
            padding: 6px;
            margin: 5px 0;
        }

        .guti:hover {
            background-color: crimson;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.6);
        }

        .opcion-comida {
            cursor: pointer;
            display: inline-block;
            margin-bottom: 5px;
        }

        a {
            color: white;
            background-color: darkred;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            box-shadow: 2px 4px 6px rgba(0, 0, 0, 0.2); 
        }

        a:hover {
            background-color: crimson;
            box-shadow: 0px 6px 12px rgba(220, 20, 60, 0.4);

        }

        .ignacio {
            color: darkred; 
            font-family: 'Comic Sans MS', sans-serif; 
            font-size: 20px; 
            margin: 20px; 
            text-align: center;
        }

        .ignacio:hover {
            color: crimson;
        }

        footer {
            margin-top: 40px;
            text-align: center;
        }
        
        .seccion-boton {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Reserva del Restaurant</h1> 
</header>

<main>
    <form>
        <label for="txtNombre">Nombre del reservante:</label> <br>
        <input id="txtNombre" class="guti" type="text">
        <br><br>
        
        <label for="txtHora">Hora de llegada:</label> <br>
        <input id="txtHora" class="guti" type="text">
        <br><br>
        
        <label for="selLocal">Local seleccionado:</label> <br>
        <select id="selLocal" class="guti">
            <option>Marsella</option>
            <option>Monaco</option>
            <option>Paris</option>
            <option>Madrid</option>
            <option>Chillan</option>
        </select>
        <br><br>
        
        <label for="selComensales">Seleccione cuantos comensales son:</label> <br>
        <select id="selComensales" class="guti">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
        </select>
        <br><br>
        
        <fieldset>
            <legend style="font-weight: normal; font-size: inherit; color: inherit; padding: 0;">Seleccione su comida reservada:</legend>
            <label class="opcion-comida"><input type="checkbox"> Italiana</label> <br> 
            <label class="opcion-comida"><input type="checkbox"> Española</label> <br>
            <label class="opcion-comida"><input type="checkbox"> Chilena</label> <br>
            <label class="opcion-comida"><input type="checkbox"> Peruana</label> <br>
            <label class="opcion-comida"><input type="checkbox"> China</label> <br>
        </fieldset>
        <br>
        
        <label for="txtAlergias">Ingrese alguna alergia o especificación (si no, deje en blanco):</label> <br>
        <textarea id="txtAlergias" class="guti" cols="30" rows="4"></textarea> 
        <br><br>

        <button class="guti" type="button">
            Reservar
        </button>
    </form>

    <hr>    

    <div class="seccion-boton">
        <a href="Menu.html">
            Volver al menú
        </a>
    </div>
</main>

<footer>
    <p class="ignacio">&copy; 2026 Restaurant Menu. Todos los derechos reservados por Mateo Millar.</p>
</footer>

</body>
</html>
